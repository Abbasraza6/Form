<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>

        <h1>Sign-up Registration Form</h1>
        <p>Please fill out this form completely to register with our company!</p>

        <form action="http://www.example.com/subscribe.php" method="get">
        
        <p>Username: <br>
        <input type="text" name="username" placeholder="Enter your name" size="40" 
        maxlength="15" required />
        </p>

        <p>Email: <br>
        <input type="email" name="email" placeholder="Enter your email" size="40" required>
        </p>

        <p>Password: <br>
        <input type="password" name="password" placeholder="Enter your password"  
        size="40" maxlength="30" required />
        </p>

        <p>Age: <br>
        <input type="number" name="age" min="1" max="30" required />
        </p>

        <p>Date of Birth: <br>
        <input type="date" name="date_of_birth" required />
        </p>

        <p>Your Gender: <br>
        <input type="radio" name="gender" value="Male" checked="checked" /> Male 
        <input type="radio" name="gender" value="Female" /> Female
        </p>

         <p>Hobbies: <br>
        <input type="checkbox" name="hobby" value="reading" > Reading
        <input type="checkbox" name="hobby" value="sports" > Sports
        <input type="checkbox" name="hobby" value="gaming" > Gaming
        </p>

        <p> Country: <br>
            <select name="country">
            <option value="">Select</option>
            <option value="pakistan">Pakistan</option>
            <option value="usa">USA</option>
            </select>
        </p>

        <p>Address: <br>
        <textarea name="address" rows="3" cols="40" required></textarea>
        </p>


        <p>Upload Profile Picture:
        <input type="file" name="profile">
        </p>

        <button type="submit">Sign Up</button>
        <button type="button" onclick="history.back()" >Go Back</button>

    </form>
    </body>
</html>
